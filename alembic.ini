; ---- alembic.ini ----
; ΓΙΑΤΙ ΥΠΑΡΧΕΙ:
; Είναι το αρχείο ρυθμίσεων του Alembic. Λέει στο Alembic πού βρίσκεται ο
; φάκελος με τα migration scripts (script_location) και άλλες γενικές
; ρυθμίσεις (π.χ. πώς ονοματίζονται τα αρχεία migration).
;
; Σημείωσε ότι ΔΕΝ βάζουμε εδώ το πραγματικό DATABASE_URL. Αυτό γίνεται
; δυναμικά μέσα στο alembic/env.py, διαβάζοντας το από τα Settings
; (δηλαδή τελικά από το .env) — έτσι δεν χρειάζεται να διπλογράφουμε
; ή να hardcode-άρουμε το connection string σε δύο σημεία.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
